name: Surveillance EDT

on:
  schedule:
    - cron: "7,27,47 4-20 * * *"   # toutes les 20 min, 6h-22h heure de Paris (été)
    - cron: "17 21,23,1,3 * * *"   # toutes les 2 h la nuit (horaires en UTC)
  workflow_dispatch:

# Repo public : l'ID du sheet, le gist et les pings sont des secrets (masqués dans les logs),
# l'état du planning vit dans le repo privé edt-m2-watcher-data.
permissions:
  contents: read
  actions: write   # garde le planifié actif (voir la dernière étape)

concurrency:
  group: edt-watch
  cancel-in-progress: false

env:
  # plusieurs sheets possibles (secret SHEET_IDS, séparés par des virgules), chacun avec son état dans state/<id>
  SHEET_IDS: ${{ secrets.SHEET_IDS }}
  WATCH_TAGS: IBI,SBI

jobs:
  watch:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Checkout de l'état (repo privé)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/edt-m2-watcher-data
          token: ${{ secrets.DATA_TOKEN }}
          path: datas

      - name: Relevé du sheet
        id: scan
        run: python3 -m watcher scan --state datas/state --out "$RUNNER_TEMP/watch" --ics datas/ics

      - name: Commit de l'état
        id: commit
        if: steps.scan.outputs.changed == 'true'
        working-directory: datas
        run: |
          git config user.name "Jonathan8520"
          git config user.email "103694268+Jonathan8520@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -F "$RUNNER_TEMP/watch/commit_msg.txt"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "prev=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"

      # notification avant le push : si Discord échoue, l'état n'est pas poussé et le prochain passage renvoie
      - name: Notification Discord
        if: steps.scan.outputs.notify == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PINGS: ${{ secrets.DISCORD_PINGS }}
          ICS_GIST_ID: ${{ secrets.ICS_GIST_ID }}
          RECAP_API_KEY: ${{ secrets.RECAP_API_KEY }}
          RECAP_MODELS: ${{ vars.RECAP_MODELS }}
          RECAP_ENDPOINT: ${{ vars.RECAP_ENDPOINT }}
          PREV_SHA: ${{ steps.commit.outputs.prev }}
        run: python3 -m watcher notify --report "$RUNNER_TEMP/watch/report.json" --ics-dir datas/ics --log datas/state/messages.jsonl

      - name: Push de l'état
        if: steps.commit.outputs.sha != ''
        working-directory: datas
        run: |
          # ajoute le journal des messages au commit du changement, puis pousse
          git add -A
          git diff --cached --quiet || git commit -q --amend --no-edit
          git push -q origin HEAD:main

      # abonnement calendrier : copie les .ics dans le gist secret (seulement ce qui a changé)
      - name: Publication des calendriers
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          ICS_GIST_ID: ${{ secrets.ICS_GIST_ID }}
        run: python3 -m watcher gist --dir datas/ics

      # Sur un repo public, GitHub coupe le planifié après 60 jours sans commit sur main.
      # Les commits partent dans le repo privé : on réactive donc le workflow nous-mêmes,
      # ce qui remet le compteur à zéro (un passage de nuit suffit largement).
      - name: Garder le planifié actif
        if: github.event.schedule == '17 21,23,1,3 * * *'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/surveillance.yml/enable"
          req = urllib.request.Request(url, method="PUT", headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
          urllib.request.urlopen(req, timeout=20)
          print("Workflow réactivé.")
          PY
