name: Test de la phrase de résumé

# Lancement manuel uniquement : rejoue un changement déjà enregistré sur datas et affiche la phrase dans les logs.
# N'envoie rien sur Discord.
on:
  workflow_dispatch:
    inputs:
      old:
        description: "Commit datas avant le changement"
        required: true
      new:
        description: "Commit datas après le changement"
        required: true

permissions:
  contents: read

env:
  SHEET_IDS: ${{ vars.SHEET_IDS || 'ID_DU_SHEET' }}
  WATCH_TAGS: IBI,SBI

jobs:
  recap:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: datas
          path: datas
          fetch-depth: 0
      - name: Phrase de résumé
        env:
          RECAP_API_KEY: ${{ secrets.RECAP_API_KEY }}
          RECAP_MODELS: ${{ vars.RECAP_MODELS }}
          OLD: ${{ inputs.old }}
          NEW: ${{ inputs.new }}
        run: python3 -m watcher recap --datas datas --old "$OLD" --new "$NEW"
