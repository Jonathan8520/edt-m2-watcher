name: Test de la phrase de résumé

# Lancement manuel uniquement : rejoue un changement déjà enregistré dans edt-m2-watcher-data et affiche la phrase
# dans les logs. N'envoie rien sur Discord. Repo public : les logs sont visibles, supprimer le run après lecture.
on:
  workflow_dispatch:
    inputs:
      old:
        description: "Commit de edt-m2-watcher-data avant le changement"
        required: true
      new:
        description: "Commit de edt-m2-watcher-data après le changement"
        required: true

permissions:
  contents: read

env:
  SHEET_IDS: ${{ secrets.SHEET_IDS }}
  WATCH_TAGS: IBI,SBI

jobs:
  recap:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/edt-m2-watcher-data
          token: ${{ secrets.DATA_TOKEN }}
          path: datas
          fetch-depth: 0
      - name: Phrase de résumé
        env:
          RECAP_API_KEY: ${{ secrets.RECAP_API_KEY }}
          RECAP_MODELS: ${{ vars.RECAP_MODELS }}
          RECAP_ENDPOINT: ${{ vars.RECAP_ENDPOINT }}
          OLD: ${{ inputs.old }}
          NEW: ${{ inputs.new }}
        run: python3 -m watcher recap --datas datas --old "$OLD" --new "$NEW"
